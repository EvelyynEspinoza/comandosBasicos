name: Nueva funcionalidad
description: Solicitar una nueva característica
title: "[FEATURE] "
labels: ["enhancement"]
assignees: []
projects: 
- issueproject

body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Explica qué se necesita implementar.
      placeholder: Describe la funcionalidad...
    validations:
      required: true

  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: ¿Cómo se comprobará que está terminada?
      placeholder: |
        - [ ] Criterio 1
        - [ ] Criterio 2
    validations:
      required: true

  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad
      options:
        - Alta
        - Media
        - Baja
    validations:
      required: true
